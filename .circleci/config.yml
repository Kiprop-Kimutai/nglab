version: 2
jobs:
  build:
    working_directory: ~/nglab
    docker:
      - image: cimg/node:26.12
    steps:
      - checkout
      - restore_cache:
          key: nglab-{{ .Branch }}-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: nglab-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - "node_modules"
      - run: npm run build
      - run: npm test -- --watch=false